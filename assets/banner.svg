<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="40%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="speedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Radial Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="pulseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- CSS Keyframe Animations for Dynamic SVG -->
    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes waveScroll {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -400; }
      }
      @keyframes sparkle {
        0%, 100% { transform: scale(0.85); opacity: 0.3; }
        50% { transform: scale(1.2); opacity: 1; }
      }
      .floating-node {
        animation: floatSlow 4s ease-in-out infinite;
      }
      .wave-line {
        stroke-dasharray: 10, 10;
        animation: waveScroll 18s linear infinite;
      }
      .particle-glow {
        animation: sparkle 3.5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Cyber Grid Pattern in Background -->
  <g opacity="0.12">
    <path d="M0 50 H1200 M0 100 H1200 M0 150 H1200 M0 200 H1200 M0 250 H1200 M0 300 H1200 M0 350 H1200" stroke="#94a3b8" stroke-width="1"/>
    <path d="M100 0 V380 M200 0 V380 M300 0 V380 M400 0 V380 M500 0 V380 M600 0 V380 M700 0 V380 M800 0 V380 M900 0 V380 M1000 0 V380 M1100 0 V380" stroke="#94a3b8" stroke-width="1"/>
  </g>

  <!-- Ambient Glow Blobs -->
  <circle cx="180" cy="190" r="140" fill="#38bdf8" opacity="0.08" filter="url(#pulseGlow)" />
  <circle cx="980" cy="180" r="160" fill="#818cf8" opacity="0.09" filter="url(#pulseGlow)" />
  <circle cx="600" cy="90" r="120" fill="#c084fc" opacity="0.07" filter="url(#pulseGlow)" />

  <!-- Animated Performance Waves -->
  <path class="wave-line" d="M 0 320 Q 300 240, 600 310 T 1200 250" fill="none" stroke="url(#primaryGlow)" stroke-width="2.5" opacity="0.35"/>
  <path class="wave-line" d="M 0 290 Q 250 340, 650 270 T 1200 310" fill="none" stroke="url(#speedGrad)" stroke-width="2" opacity="0.3"/>

  <!-- Glowing Animated Particles -->
  <circle class="particle-glow" cx="220" cy="110" r="3.5" fill="#38bdf8" filter="url(#glow)"/>
  <circle class="particle-glow" cx="440" cy="70" r="4.5" fill="#c084fc" filter="url(#glow)"/>
  <circle class="particle-glow" cx="940" cy="80" r="3" fill="#34d399" filter="url(#glow)"/>
  <circle class="particle-glow" cx="1060" cy="270" r="4" fill="#60a5fa" filter="url(#glow)"/>
  <circle class="particle-glow" cx="120" cy="280" r="3.5" fill="#818cf8" filter="url(#glow)"/>

  <!-- Left Side: Interactive Database Node Visualizer -->
  <g transform="translate(70, 75)" class="floating-node">
    <rect width="210" height="230" rx="14" fill="url(#cardGrad)" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1.5" />
    
    <!-- Database Icon Cylinders -->
    <g transform="translate(45, 25)">
      <ellipse cx="60" cy="20" rx="42" ry="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5" filter="url(#glow)"/>
      <path d="M 18 20 V 42 A 42 14 0 0 0 102 42 V 20" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5" />
      <ellipse cx="60" cy="42" rx="42" ry="14" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.5"/>
      
      <path d="M 18 42 V 64 A 42 14 0 0 0 102 64 V 42" fill="#1e293b" stroke="#818cf8" stroke-width="2.5" />
      <ellipse cx="60" cy="64" rx="42" ry="14" fill="none" stroke="#818cf8" stroke-width="2" stroke-opacity="0.5"/>

      <path d="M 18 64 V 86 A 42 14 0 0 0 102 86 V 64" fill="#1e293b" stroke="#c084fc" stroke-width="2.5" />
      <ellipse cx="60" cy="86" rx="42" ry="14" fill="none" stroke="#c084fc" stroke-width="2" stroke-opacity="0.5"/>

      <path d="M 62 30 L 52 52 L 63 52 L 58 74 L 72 48 L 62 48 Z" fill="url(#speedGrad)" filter="url(#glow)" />
    </g>

    <!-- Query Optimization Stat Inside Card -->
    <rect x="20" y="145" width="170" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="30" y="167" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">LATENCY:</text>
    <text x="88" y="167" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f87171">850ms</text>
    <path d="M 132 163 L 142 163 M 138 159 L 143 163 L 138 167" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>
    <text x="148" y="167" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#34d399">12ms</text>

    <!-- Index Gain Tag -->
    <rect x="20" y="187" width="170" height="26" rx="6" fill="#064e3b" fill-opacity="0.4" stroke="#059669" stroke-width="1"/>
    <text x="32" y="204" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#34d399">⚡ 98.6% QUERY SPEEDUP</text>
  </g>

  <!-- Center Content: Main Titles and Value Proposition -->
  <g transform="translate(325, 75)">
    <!-- Curated Category Tag -->
    <rect x="0" y="0" width="315" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <circle cx="14" cy="14" r="5" fill="#38bdf8" filter="url(#glow)"/>
    <text x="28" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.8" fill="#cbd5e1">⚡ THE DEFINITIVE PERFORMANCE HUB</text>

    <!-- Main Title -->
    <text x="0" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Awesome Query Performance
    </text>
    
    <!-- Subtitle with Gradient -->
    <text x="0" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="29" font-weight="800" fill="url(#primaryGlow)" letter-spacing="-0.5" filter="url(#glow)">
      &amp; Database Optimization
    </text>

    <!-- Description Paragraph -->
    <text x="0" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="400" fill="#94a3b8">
      Curated tools, analyzers, execution-plan visualizers, index advisors,
    </text>
    <text x="0" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="400" fill="#94a3b8">
      workload profilers &amp; open-source engines for high-throughput SQL databases.
    </text>

    <!-- Tech Tags Pills -->
    <g transform="translate(0, 195)">
      <rect x="0" y="0" width="94" height="26" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
      <text x="12" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#60a5fa">🐘 PostgreSQL</text>

      <rect x="104" y="0" width="76" height="26" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
      <text x="114" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#fbbf24">🐬 MySQL</text>

      <rect x="190" y="0" width="94" height="26" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="1"/>
      <text x="200" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#f87171">🗄️ SQL Server</text>

      <rect x="294" y="0" width="104" height="26" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
      <text x="304" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#34d399">🎯 Index Tuning</text>

      <rect x="408" y="0" width="112" height="26" rx="6" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
      <text x="418" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#a78bfa">🔍 EXPLAIN Plans</text>
    </g>
  </g>

  <!-- Right Side Visual: Execution Plan Tree Simulation -->
  <g transform="translate(935, 75)" class="floating-node">
    <rect width="200" height="230" rx="14" fill="url(#cardGrad)" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1.5" />
    
    <text x="18" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#94a3b8" letter-spacing="0.5">EXPLAIN EXECUTION PLAN</text>
    
    <!-- Tree Root -->
    <rect x="20" y="45" width="160" height="34" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2"/>
    <circle cx="34" cy="62" r="4" fill="#34d399"/>
    <text x="46" y="60" font-family="monospace" font-size="10" font-weight="700" fill="#e0e7ff">Aggregate (Sort)</text>
    <text x="46" y="72" font-family="monospace" font-size="8.5" fill="#818cf8">cost=12.4..15.2</text>

    <!-- Branch Lines -->
    <path d="M 60 79 V 95 H 45 V 105 M 60 95 H 125 V 105" fill="none" stroke="#475569" stroke-width="1.5"/>

    <!-- Left Child: Index Scan -->
    <rect x="18" y="105" width="80" height="38" rx="5" fill="#064e3b" stroke="#10b981" stroke-width="1.2"/>
    <text x="24" y="121" font-family="monospace" font-size="8.5" font-weight="700" fill="#34d399">Index Scan</text>
    <text x="24" y="134" font-family="monospace" font-size="7.5" fill="#a7f3d0">users_pk</text>

    <!-- Right Child: Hash Join -->
    <rect x="106" y="105" width="76" height="38" rx="5" fill="#4c1d95" stroke="#a855f7" stroke-width="1.2"/>
    <text x="113" y="121" font-family="monospace" font-size="8.5" font-weight="700" fill="#c084fc">Hash Join</text>
    <text x="113" y="134" font-family="monospace" font-size="7.5" fill="#ddd6fe">orders_fk</text>

    <!-- Execution Time Gauge -->
    <g transform="translate(18, 160)">
      <rect width="164" height="52" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#94a3b8">Execution Time</text>
      <text x="12" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#38bdf8">0.42 ms</text>
      
      <path d="M 105 38 L 115 32 L 125 35 L 135 24 L 145 28 L 155 18" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    </g>
  </g>
</svg>
